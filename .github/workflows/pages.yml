# Deploys the static dashboard/ directory to GitHub Pages.
# The site is not created by this file alone. On 2026-10-29 the Pages API
# returned 404 and https://zwang1111.github.io/agenttab-portaldot/ returned
# HTTP 404. An admin has to set Settings → Pages → Source → GitHub Actions.
# Until a GET of that host returns 200, do not send judges there.
# When Pages is still off, this workflow skips deploy and stays green.
# Retrigger after Pages source was set to GitHub Actions.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true)
          echo "Pages API HTTP ${code}"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled (HTTP ${code}). Skipping deploy."
            echo "https://zwang1111.github.io/agenttab-portaldot/ is not a demo URL until a later GET returns 200."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
